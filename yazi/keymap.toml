[mgr]
prepend_keymap = [
  # 向下滚动预览 10 行（原默认是 5）
  { on = "J", run = "seek 1",  desc = "Scroll preview down 10 lines" },

  # 向上滚动预览 10 行（负数表示向上）
  { on = "K", run = "seek -1", desc = "Scroll preview up 10 lines" },
]

[[manager.prepend_keymap]]
on   = [ "e" ]
run  = "open"
desc = "编辑文件 (使用你配置的 vim/nvim)"

[[manager.prepend_keymap]]
on   = [ "V" ]
run  = 'shell --block "nvim -R \"$1\"" --confirm'
desc = "以只读模式在 Neovim 中预览 (查看渲染效果)"

[[manager.prepend_keymap]]
on   = [ "y" ]
run  = "copy path"
desc = "复制当前文件路径"

[[manager.prepend_keymap]]
on   = [ "T" ]
run  = 'shell --block "$SHELL"'
desc = "在当前目录打开终端"

[[manager.prepend_keymap]]
on   = [ "p" ]
run  = "plugin --sync smart-enter"
desc = "智能进入 (如果安装了此插件)"

